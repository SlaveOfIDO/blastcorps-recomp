# Draw Distance Patch for single player
[[patches.instruction]]
func = "func_8006DC64"
vram = 0x8006DD68
value = 0x0

[[patches.hook]]
func = "func_8006DC64"
text = """
gpr savedR2 = ctx->r2;
gpr savedR5 = ctx->r5;
gpr savedR4 = ctx->r4;

recomp_get_draw_distance_config(rdram, ctx);
if ((uint32_t) ctx->r2 == 0) { // Extended
    ctx->r4 = S32(0X8017 << 16); // gCurrentLevel Address 0x801687A8
    ctx->r4 = ADD32(ctx->r4, -0x7858);
    ctx->r5 = MEM_W(ctx->r4, 0X0); // gCurrentLevel Value
    switch ((uint32_t) ctx->r5) {
        case 0: // DESERT_1_AZTEC_RUINS
        case 1: // DESERT_2_BONES_AND_PIPES
        case 2: // DESERT_3_SPACESHIP_GRAVEYARD
        case 3: // MINES_1_THE_TUNNEL
        case 4: // MINES_2_THE_CANYON
        case 5: // MINES_3_THE_VOLCANO
            ctx->r5 = savedR5;ctx->r5 = S32(0X4000 << 16); // 0x8006DD68: lui         $a1, 0x4000
            break;
        default:
            ctx->r5 = savedR5;ctx->r5 = S32(0X4080 << 16); // 0x8006DD68: lui         $a1, 0x4080
            break;
    }
} else if ((uint32_t) ctx->r2 == 2) { // Extreme
    ctx->r5 = savedR5;
    ctx->r5 = S32(0X4080 << 16); // 0x8006DD68: lui         $a1, 0x4080
} else { // Original
    ctx->r5 = savedR5;
    ctx->r5 = S32(0X3F80 << 16);
}
ctx->r2 = savedR2;
ctx->r4 = savedR4;
"""
before_vram = 0x8006DD6C

# Fog distance patch, affects all players
[[patches.instruction]]
func = "func_8006B1AC"
vram = 0x8006B620
value = 0x0
[[patches.hook]]
func = "func_8006B1AC"
text = """
gpr savedR2 = ctx->r2;
gpr savedR5 = ctx->r5; // Save registers
gpr savedR4 = ctx->r4; // Save registers
recomp_get_fog_distance_config(rdram, ctx);
switch ((uint32_t) (ctx->r2)) {
case 2: // Original
    ctx->r5 = savedR5;ctx->r5 = ctx->r5 | 0XF400; // original
    goto Override;
    break;
case 1: // Extreme
    ctx->r5 = savedR5;ctx->r5 = ctx->r5 | 0X0000;
    goto Override;
    break;
default:
case 0:
    goto Extended;
    break;
}
Extended:
ctx->r4 = S32(0X8017 << 16); // gCurrentLevel Address
ctx->r4 = ADD32(ctx->r4, -0x7858); // 0x801687A8
ctx->r5 = MEM_W(ctx->r4, 0X0); // gCurrentLevel Value
switch ((uint32_t) ctx->r5) { 
case 0: // DESERT_1_AZTEC_RUINS:
case 7: // CITY_2_URBAN_MOTORWAY:
case 4: // MINES_2_THE_CANYON:
        ctx->r5 = savedR5;ctx->r5 = ctx->r5 | 0XEC00;
    break;
case 1: //DESERT_2_BONES_AND_PIPES:
case 6: // CITY_1_INDUSTRIAL_ZONE:
    ctx->r5 = savedR5;ctx->r5 = ctx->r5 | 0XE800;
    break;
case 2: // DESERT_3_SPACESHIP_GRAVEYARD:
case 3: // MINES_1_THE_TUNNEL:
    ctx->r5 = savedR5;ctx->r5 = ctx->r5 | 0XF400; // original
    break;
default:
    ctx->r5 = savedR5;ctx->r5 = ctx->r5 | 0XDD00;
    break;
}
Override:
ctx->r4 = savedR4;
ctx->r2 = savedR2;
"""
before_vram = 0x8006B624

